<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CompoundTrack v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f3;--surface:#fff;--border:#e4e2dc;--text:#1a1916;--muted:#7a7870;--brooksville:#0b6e4f;--brooksville-bg:#edf7f3;--hallandale:#1a5fa8;--hallandale-bg:#eaf2fc;--centercity:#4f35b5;--centercity-bg:#eeecfb;--strive:#8a4f0a;--strive-bg:#fdf0e0;--olympia:#2d6a1a;--olympia-bg:#edf5e8;--pdrx:#a82222;--pdrx-bg:#fceaea;--alphabio:#8a1f5a;--alphabio-bg:#fceaf4;--stryker:#6a5500;--stryker-bg:#faf5e0;--best:#0b6e4f;--danger:#a82222;--danger-bg:#fceaea;--danger-border:#f5c1c1;--warn:#8a4f0a;--warn-bg:#fdf0e0;--warn-border:#f5d5a0;--success:#0b6e4f;--success-bg:#edf7f3;--info:#1a5fa8;--info-bg:#eaf2fc}
body{font-family:'DM Sans',sans-serif;font-size:13px;background:var(--bg);color:var(--text);min-height:100vh}
.login-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--text);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:var(--surface);border-radius:16px;padding:32px;width:380px;max-width:95vw}
.login-logo{font-size:20px;font-weight:600;margin-bottom:6px}.login-logo span{color:#6ee7b7}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.login-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;display:block}
.login-select,.login-pin{width:100%;padding:10px 12px;border:.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text)}
.login-select{font-size:13px;margin-bottom:14px}
.login-pin{font-size:16px;font-family:'DM Mono',monospace;letter-spacing:4px;margin-bottom:6px;text-align:center}
.login-pin:focus{border-color:var(--text);outline:none}
.login-hint{font-size:11px;color:var(--muted);margin-bottom:18px;text-align:center}
.login-err{font-size:12px;color:var(--danger);margin-bottom:10px;text-align:center;min-height:16px}
.login-btn{width:100%;padding:11px;background:var(--text);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-left:8px}
.role-badge.admin{background:#edf7f3;color:#0b6e4f}.role-badge.coordinator{background:#eaf2fc;color:#1a5fa8}.role-badge.provider{background:#eeecfb;color:#4f35b5}.role-badge.staff{background:#fdf0e0;color:#8a4f0a}
.view-toggle{display:flex;align-items:center;gap:8px;padding:4px 10px;background:rgba(255,255,255,.1);border-radius:8px;font-size:11px;color:rgba(255,255,255,.8)}
.view-toggle select{background:transparent;border:none;color:white;font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none}
.view-toggle select option{background:#1a1916;color:white}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--text);color:white;padding:0 20px;display:flex;align-items:center;gap:16px;height:50px;flex-shrink:0;position:sticky;top:0;z-index:200;width:100vw;margin-left:calc(-50vw + 50%);box-sizing:border-box}
.logo{font-size:15px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}.logo span{color:#6ee7b7}
.nav{display:flex;gap:1px;flex:1;overflow-x:auto}
.nav button{background:none;border:none;padding:0 16px;height:50px;font-size:14px;cursor:pointer;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;transition:all .15s}
.nav button:hover{color:white;background:rgba(255,255,255,.07)}.nav button.active{color:white;border-bottom-color:#6ee7b7}
.content{flex:1;padding:18px 20px;max-width:1400px;width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:12px 14px}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.stat-val{font-size:22px;font-weight:600;font-family:'DM Mono',monospace}
.stat-val.danger{color:var(--danger)}.stat-val.warn{color:var(--warn)}.stat-val.success{color:var(--success)}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.card-pad{padding:14px 16px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-header h2{font-size:16px;font-weight:600;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 12px;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:.5px solid var(--border);background:#faf9f7}
td{padding:7px 12px;border-bottom:.5px solid #f0efe9;vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafaf8}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:.5px solid var(--border);background:none;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);font-weight:500;transition:all .15s}
.btn:hover{background:var(--bg)}.btn.primary{background:var(--text);color:white;border-color:var(--text)}.btn.primary:hover{opacity:.88}
.btn.sm{padding:4px 9px;font-size:11px}.btn.danger{color:var(--danger);border-color:var(--danger-border)}.btn.danger:hover{background:var(--danger-bg)}
.hamburger{display:none;background:none;border:none;color:white;font-size:22px;cursor:pointer;padding:0 4px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;min-width:140px;text-align:center}
.badge.awaiting-payment-verification{background:#faeeda;color:#854f0b}.badge.payment-confirmed-ready-to-place{background:#edf7f3;color:#0b6e4f}
.badge.ordered{background:#eaf2fc;color:#1a5fa8}.badge.processing{background:#eeecfb;color:#4f35b5}
.badge.shipped{background:#edf5e8;color:#2d6a1a}.badge.delivered{background:#edf7f3;color:#0b6e4f;font-weight:700}
.badge.on-hold{background:#fceaea;color:#a82222}.badge.returned-to-provider{background:#fceaea;color:#a82222;font-weight:700}
.badge.pending{background:#faeeda;color:#854f0b}.badge.on-subscription{background:#eeecfb;color:#4f35b5;font-weight:700}
.flag{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.3px;margin:1px}
.flag.ctrl{background:var(--pdrx-bg);color:var(--pdrx)}.flag.research{background:var(--alphabio-bg);color:var(--alphabio)}
.flag.watch{background:var(--strive-bg);color:var(--strive)}.flag.inoffice{background:var(--hallandale-bg);color:var(--hallandale)}
.flag.goodrx{background:#edf7f3;color:#0b6e4f}.flag.noorder{background:#f0efe9;color:#7a7870}
.ph{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.ph.brooksville{background:var(--brooksville-bg);color:var(--brooksville)}.ph.hallandale{background:var(--hallandale-bg);color:var(--hallandale)}
.ph.centercity{background:var(--centercity-bg);color:var(--centercity)}.ph.strive{background:var(--strive-bg);color:var(--strive)}
.ph.olympia{background:var(--olympia-bg);color:var(--olympia)}.ph.pdrx{background:var(--pdrx-bg);color:var(--pdrx)}
.ph.alphabio,.ph.soma{background:var(--alphabio-bg);color:var(--alphabio)}.ph.stryker,.ph.southlake,.ph.nucare{background:var(--stryker-bg);color:var(--stryker)}
.form-row{margin-bottom:11px}
.form-row label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#1a1916}
.form-row textarea{min-height:68px;resize:vertical}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:.5px solid var(--border);border-radius:8px;margin-bottom:7px;cursor:pointer;transition:background .1s}
.check-row:hover{background:var(--bg)}.check-row input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--text)}.check-row label{cursor:pointer;font-size:12px;line-height:1.4}
.alert{padding:10px 13px;border-radius:8px;font-size:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert.danger{background:var(--danger-bg);border:.5px solid var(--danger-border);color:var(--danger)}
.alert.warn{background:var(--warn-bg);border:.5px solid var(--warn-border);color:var(--warn)}
.alert.info{background:var(--info-bg);border:.5px solid #c5d8f5;color:var(--info)}
.alert.success{background:var(--success-bg);border:.5px solid #b0e0cc;color:var(--success)}
.filters{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{padding:7px 10px;border:.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none}
.filters input{flex:1;min-width:180px}.filters select{min-width:140px}
.detail{background:var(--bg);border-radius:10px;padding:13px;margin-top:8px;font-size:12px}
.detail-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid var(--border)}
.detail-row:last-child{border-bottom:none}.detail-label{color:var(--muted);font-weight:500}
.hold-note{background:var(--warn-bg);border:.5px solid var(--warn-border);border-radius:6px;padding:7px 10px;margin-top:8px;font-size:11px;color:var(--warn)}
.ph-card{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ph-name{font-weight:600;font-size:13px;margin-bottom:2px}.ph-meta{font-size:11px;color:var(--muted);line-height:1.7}
.ph-meds{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ph-med-tag{background:var(--bg);border:.5px solid var(--border);border-radius:10px;padding:2px 8px;font-size:10px;color:var(--muted)}
.cat-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:12px}
.cat-tab{background:none;border:.5px solid transparent;padding:4px 11px;border-radius:6px;font-size:13px;cursor:pointer;color:rgba(255,255,255,.85);font-family:'DM Sans',sans-serif;font-weight:500}
.cat-tab.active{border-color:var(--border);background:var(--surface);color:var(--text)}.cat-tab:hover:not(.active){background:rgba(255,255,255,.15);color:#fff}
.cat-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:7px 12px;background:#faf9f7;border-bottom:.5px solid var(--border)}
.price-rows .pr{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.price-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}.price-val.best{color:var(--best);font-weight:600}
.best-col{font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:var(--best)}.note-t{font-size:10px;color:#aaa;font-style:italic}
.legend{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);padding:10px 0;margin-bottom:4px}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.qc-bar{background:#0f3d2e;border-radius:12px;padding:16px 20px;margin-bottom:16px}
.qc-bar h3{font-size:14px;font-weight:600;color:white;margin-bottom:2px}
.qc-bar p{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:12px}
.qc-grid{display:grid;grid-template-columns:1.2fr 1.5fr 1fr auto;gap:8px;align-items:end}
.qc-field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.5);margin-bottom:4px}
.qc-field input,.qc-field select{width:100%;padding:9px 11px;border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,.1);color:white;outline:none}
.qc-field input::placeholder{color:rgba(255,255,255,.35)}.qc-field select option{background:#1a1916;color:white}
.qc-field input:focus,.qc-field select:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.qc-submit{padding:10px 16px;background:#6ee7b7;color:#0b3d28;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.qc-suggestion{background:rgba(255,255,255,.08);border:1px solid rgba(110,231,183,.3);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12px;display:none}
.qc-suggestion.show{display:block}.qc-ph-rec{font-size:13px;font-weight:700;color:#6ee7b7;margin-bottom:3px}
.qc-ph-meta{font-size:11px;color:rgba(255,255,255,.55)}
.qc-warning{background:rgba(200,80,0,.2);border:1px solid rgba(200,80,0,.3);border-radius:6px;padding:7px 11px;font-size:11px;color:#fbbf7a;margin-top:6px}
.cl-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:600}
.cl-box{background:white;border-radius:16px;width:580px;max-width:95vw;max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.cl-head{padding:18px 22px 14px;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1}
.cl-head h2{font-size:15px;font-weight:600}.cl-patient{font-size:12px;color:var(--muted);margin-top:2px}
.cl-steps{padding:16px 22px 22px}
.cl-step{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:10px;margin-bottom:8px;border:.5px solid var(--border);background:var(--bg);transition:background .15s,border-color .15s}
.cl-step.done{background:#edf7f3;border-color:#b0e0cc}.cl-step.active{background:#fffbef;border-color:#f5c55a;box-shadow:0 0 0 3px rgba(245,197,90,.1)}.cl-step.locked{opacity:.4;pointer-events:none}
.cl-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;background:var(--border);color:var(--muted)}
.cl-step.done .cl-num{background:#0b6e4f;color:white}.cl-step.active .cl-num{background:#d97706;color:white}
.cl-body{flex:1;min-width:0}.cl-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}.cl-desc{font-size:11px;color:var(--muted);line-height:1.55}
.cl-action{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cl-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.cl-btn.primary{background:#1a1916;color:white}.cl-btn.success{background:#0b6e4f;color:white}.cl-btn.danger{background:var(--danger-bg);color:var(--danger);border:.5px solid var(--danger-border)}.cl-btn.secondary{background:var(--surface);color:var(--text);border:.5px solid var(--border)}
.cl-warn-box{background:var(--warn-bg);border:.5px solid var(--warn-border);border-radius:8px;padding:9px 12px;margin-top:6px;font-size:11px;color:var(--warn);line-height:1.55}
.cl-input{width:100%;padding:8px 10px;border:.5px solid var(--border);border-radius:7px;font-size:13px;font-family:'DM Mono',sans-serif;background:var(--bg);color:var(--text);margin-top:6px;outline:none}
.cl-check{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:.5px solid var(--border);border-radius:7px;margin-top:6px;cursor:pointer}
.cl-check input[type=checkbox]{width:15px;height:15px;accent-color:#0b6e4f;cursor:pointer}.cl-check label{font-size:12px;cursor:pointer;line-height:1.4}
.portal-card{background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px;display:flex;align-items:flex-start;gap:18px}
.portal-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-top:2px}
.portal-body{flex:1;min-width:0}.portal-name{font-size:14px;font-weight:600;margin-bottom:2px}.portal-type{font-size:11px;color:var(--muted);margin-bottom:10px}
.portal-fields{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.portal-field{display:flex;align-items:center;gap:8px;background:var(--bg);border:.5px solid var(--border);border-radius:8px;padding:7px 11px}
.portal-field-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);width:70px;flex-shrink:0}
.portal-field-val{font-family:'DM Mono',monospace;font-size:12px;flex:1;word-break:break-all}.portal-field-val.masked{letter-spacing:3px;font-size:14px;color:var(--muted)}
.portal-actions{display:flex;gap:7px;flex-wrap:wrap}
.portal-coming{background:var(--bg);border:.5px dashed var(--border);border-radius:14px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;gap:14px;opacity:.65}
.reorder-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:#edf7f3;border:.5px solid #b0e0cc;border-radius:6px;font-size:11px;font-weight:600;color:#0b6e4f;cursor:pointer;font-family:'DM Sans',sans-serif}
.ai-wrap{display:flex;flex-direction:column;max-width:860px}
.ai-context-box{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.ai-open-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;background:var(--text);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none}
.ai-copy-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:none;border:.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text);margin-left:10px}
.ai-context-preview{background:var(--bg);border:.5px solid var(--border);border-radius:8px;padding:12px;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);max-height:200px;overflow-y:auto;margin-top:12px;white-space:pre-wrap;line-height:1.6}
.invoice-import-card{background:var(--surface);border:.5px solid var(--info);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.invoice-step{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.invoice-step-num{width:24px;height:24px;border-radius:50%;background:var(--info);color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
tr.row-needs-order td{background:#fffbef!important;border-bottom-color:#f5e7a0!important}
tr.row-needs-order td:first-child{border-left:3px solid #d97706}
tr.row-in-progress td{background:#f0faf5!important;border-bottom-color:#b0e0cc!important}
tr.row-in-progress td:first-child{border-left:3px solid #0b6e4f}
tr.row-subscription td{background:#f5f3ff!important;border-bottom-color:#c4b5fd!important}
tr.row-subscription td:first-child{border-left:3px solid #7c3aed}
.card table td,.card table th{text-align:center;vertical-align:middle;padding:12px 8px}
.card table td:nth-child(1),.card table th:nth-child(1),.card table td:nth-child(2),.card table th:nth-child(2),.card table td:nth-child(3),.card table th:nth-child(3){text-align:left!important;padding-left:20px!important}
@media(max-width:850px){
.stats{grid-template-columns:1fr 1fr}.qc-grid{grid-template-columns:1fr;gap:12px}.form-2{grid-template-columns:1fr}
.card,.ph-card{overflow-x:auto;-webkit-overflow-scrolling:touch}table{white-space:nowrap;min-width:600px}
.topbar{padding:12px 16px;flex-wrap:nowrap}.hamburger{display:block}
.nav{display:none;position:absolute;top:100%;left:0;right:0;background:#1a1916;flex-direction:column;padding:10px 20px 20px;border-top:1px solid rgba(255,255,255,.1);box-shadow:0 20px 30px rgba(0,0,0,.5);z-index:1000}

function submitOrder(){
  const o=state.newOrder;
  if(!o.patientName){alert('Please enter the patient name.');return;}
  if(!o.patientDOB){alert('Please enter the date of birth.');return;}
  if(!o.medication){alert('Please enter the medication.');return;}
  if(!o.sig){alert('Please enter the sig.');return;}
  if(!o.orderedBy){alert('Please select who is ordering.');return;}
  if(!o.billingConfirmed&&!o.onSubscription){alert('Please confirm billing or mark as subscription.');return;}
  if(o._providerPlaced===undefined){alert('Please answer the LifeFile question.');return;}
  if(o._providerPlaced===true&&!o.orderNumber){alert('Please enter the LifeFile order number.');return;}
  const dup=state.orders.some(ex=>ex.patientName.toLowerCase()===o.patientName.trim().toLowerCase()&&ex.medication.toLowerCase()===o.medication.trim().toLowerCase());
  if(dup&&!confirm(`⚠️ DUPLICATE: ${o.patientName} already has an order for ${o.medication}.\n\nCreate anyway?`))return;
  const order={...o,id:'ord_'+Date.now(),status:o._providerPlaced===true?'Ordered':'Awaiting Payment Verification',dateOrdered:o.dateOrdered||new Date().toISOString().split('T')[0],paymentConfirmed:false,returnedReason:'',_needsCoordinatorOrder:o._providerPlaced!==true,_providerPlaced:undefined};
  state.orders.unshift(order);state.newOrder={};saveOrders();state.tab='orders';alert('Order submitted.');renderApp();
}

  document.getElementById('user-info').innerHTML=`${currentUser.name} <span class="role-badge ${role}">${previewRole?'Previewing: ':''}${rlm[role]||role}</span>`;
  const pw=document.getElementById('preview-toggle-wrap');
  if(currentUser.canPreview){pw.innerHTML=`<div class="view-toggle"><span style="color:rgba(255,255,255,.6);font-size:10px">Preview:</span><select onchange="setPreview(this.value)"><option value="" ${!previewRole?'selected':''}>Admin</option><option value="provider" ${previewRole==='provider'?'selected':''}>Provider</option><option value="coordinator" ${previewRole==='coordinator'?'selected':''}>Coordinator</option><option value="staff" ${previewRole==='staff'?'selected':''}>Staff</option></select></div>`;}else{pw.innerHTML='';}
  render();
}
function setPreview(r){previewRole=r||null;renderApp();}

let checklistOrder=null,checklistStep=0,checklistDone=[];
function getPharmacyRecommendation(medName){if(!medName)return null;const match=FORMULARY.find(f=>f.name===medName||medName.toLowerCase().includes(f.name.toLowerCase().substring(0,12)));if(!match)return null;const nl=medName.toLowerCase();let pid=null;if(nl.includes('testosterone')||nl.includes('test cyp')){if(nl.includes('female')||nl.includes('50mg')||nl.includes('women'))pid='hallandale';else if(nl.includes('250mg')||nl.includes('high'))pid='brooksville';else pid='centercity';}else if(nl.includes('semaglutide'))pid='centercity';else if(nl.includes('bpc')||nl.includes('peptide'))pid='alphabio';const priced=match.rows.filter(r=>r.p!=null&&r.p>0).sort((a,b)=>a.p-b.p);let best=priced.length?priced[0]:null;if(pid){const f=match.rows.find(r=>r.ph===pid);if(f)best=f;}if(!best)return null;const phData=PHARMACIES.find(p=>p.id===best.ph);return{formularyItem:match,bestRow:best,phData,pharmName:best.l?best.l.replace(/ -.*/,'').replace(/Alpha Bio -.*/,'Alpha Bio'):'Unknown',isControlled:match.flags.includes('ctrl'),needsConsent:match.flags.includes('research'),patientPrice:patientPrices[match.name]||null};}

function renderQCBar(){const medOpts=FORMULARY.filter(f=>f.rows.some(r=>r.p>0)).map(f=>`<option value="${f.name}">${f.name}</option>`).join('');return`<div class="qc-bar"><h3>⚡ Quick capture</h3><p>Provider tells you patient name + medication. Fill this out and hit Submit.</p><div class="qc-grid"><div class="qc-field"><label>Patient name</label><input id="qc_patient" placeholder="Full name" oninput="qcUpdate()"></div><div class="qc-field"><label>Medication</label><input id="qc_med" list="qc_ml" placeholder="Start typing..." oninput="qcUpdate()" autocomplete="off"><datalist id="qc_ml">${medOpts}</datalist></div><div class="qc-field"><label>Provider</label><select id="qc_provider"><option value="">Select...</option><option value="Ashlee Montalvo NP">Ashlee</option><option value="Tamara Dismukes PA">Tamara</option><option value="Leniel Santana MD">Leniel</option></select></div><button class="qc-submit" onclick="qcSubmit()">Start checklist →</button></div><div class="qc-suggestion" id="qc_suggestion"></div></div>`;}
function qcUpdate(){const med=document.getElementById('qc_med')?.value||'',sugg=document.getElementById('qc_suggestion');if(!sugg)return;if(med.length<3){sugg.className='qc-suggestion';return;}const rec=getPharmacyRecommendation(med);if(!rec){sugg.className='qc-suggestion';return;}const ph=rec.phData;sugg.className='qc-suggestion show';sugg.innerHTML=`<div class="qc-ph-rec">→ Order from: ${rec.pharmName}${ph?' · '+ph.turnaround:''}</div><div class="qc-ph-meta">Method: ${ph?ph.method:'—'} · Login: ${ph?ph.login:'See pharmacy guide'}</div>${rec.isControlled?'<div class="qc-warning">⚠ Controlled — wet signature + fax required</div>':''}${rec.needsConsent?'<div class="qc-warning">Research peptide — consent form must be on file</div>':''}${rec.patientPrice?`<div style="font-size:11px;color:#6ee7b7;margin-top:4px;font-weight:600">Patient charge: $${rec.patientPrice}</div>`:''}` ;}
function qcSubmit(){const patient=document.getElementById('qc_patient')?.value?.trim(),med=document.getElementById('qc_med')?.value?.trim(),provider=document.getElementById('qc_provider')?.value;if(!patient){alert('Enter the patient name.');return;}if(!med){alert('Enter the medication.');return;}const dup=state.orders.some(o=>o.patientName.toLowerCase()===patient.toLowerCase()&&o.medication.toLowerCase()===med.toLowerCase());if(dup&&!confirm(`⚠️ DUPLICATE: ${patient} already has an order for ${med}.\n\nCreate anyway?`))return;const rec=getPharmacyRecommendation(med);checklistOrder={id:'ord_'+Date.now(),patientName:patient,medication:med,orderedBy:provider||'Provider',pharmacy:rec?.pharmName||'',method:rec?.phData?.method||'',controlled:rec?.isControlled||false,researchConsent:rec?.needsConsent||false,billingConfirmed:false,paymentVerifiedInOpti:false,status:'Awaiting Payment Verification',dateOrdered:new Date().toISOString().split('T')[0],_rec:rec};checklistStep=0;checklistDone=[];renderChecklistOverlay();}

function renderChecklistOverlay(){const ex=document.getElementById('cl_overlay');if(ex)ex.remove();const o=checklistOrder;if(!o)return;const rec=o._rec||getPharmacyRecommendation(o.medication),pp=rec?.patientPrice||patientPrices[o.medication]||null;
const steps=[
  {id:'billing',title:'Step 1 — Confirm patient billed',desc:`Provider must confirm billing.${pp?' Patient price: <strong>$'+pp+'</strong>':''}`,action:`<div class="cl-check" onclick="this.querySelector('input').click()"><input type="checkbox" id="cl_billed" onchange="clCheckBilling()"><label for="cl_billed">Provider confirmed patient was billed${pp?' <strong>$'+pp+'</strong>':''}</label></div>`},
  {id:'sig',title:'Step 2 — Sig / directions',desc:'Enter the sig as it appears on the label.',action:`<input class="cl-input" id="cl_sig" style="margin-top:6px;font-family:'DM Mono',monospace;font-size:13px" placeholder="e.g. Inject 0.50mL twice weekly IM" value="${o.sig||''}"><div style="font-size:10px;color:var(--muted);margin-top:4px">e.g. Inject 0.25mL once weekly SubQ · Take ½ tablet daily</div><div class="cl-action" style="margin-top:8px"><button class="cl-btn success" onclick="clSaveSig()">Save & continue →</button></div>`},
  {id:'place',title:'Step 3 — Place order in LifeFile',desc:'Did you place this in LifeFile?',action:`${o.controlled?`<div class="cl-warn-box">⚠ CONTROLLED — Print, get WET SIGNATURE, fax BEFORE placing in LifeFile.</div>`:''}${o.researchConsent?`<div class="cl-warn-box" style="background:var(--alphabio-bg);border-color:#e0a8d0;color:var(--alphabio)">Research peptide — confirm consent on file.</div>`:''}
  <div style="display:flex;gap:8px;margin-top:10px;margin-bottom:10px"><button class="cl-btn success" style="flex:1;justify-content:center" onclick="clShowOrderNumField()">✓ Yes — I placed it</button><button class="cl-btn secondary" style="flex:1;justify-content:center" onclick="clFlagForCoord()">✗ No — flag for coordinator</button></div>
  <div id="cl_ordnum_wrap" style="display:none"><label style="font-size:10px;font-weight:600;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px">LifeFile order #</label><div style="display:flex;gap:6px"><input class="cl-input" style="margin-top:0;font-family:'DM Mono',monospace" id="cl_ordnum" placeholder="Paste order number..."><button class="cl-btn success" onclick="clSaveOrderNumber()" style="white-space:nowrap">Save →</button></div></div>`},
  {id:'done',title:'✓ Order logged',desc:o._needsCoordinatorOrder?'Queued for coordinator.':'Order placed. Add tracking when available.',action:o._needsCoordinatorOrder?`<div class="alert info">ℹ️ Flagged for coordinator to place in LifeFile.</div><button class="cl-btn success" style="width:100%;padding:11px;justify-content:center" onclick="clFinish()">Done ✓</button>`:`<div style="display:flex;gap:6px;margin-bottom:10px"><input class="cl-input" style="margin-top:0" id="cl_tracking" placeholder="Tracking # (optional)"><button class="cl-btn primary" onclick="clSaveTracking()">Save</button></div><button class="cl-btn success" style="width:100%;padding:11px;justify-content:center" onclick="clFinish()">Done ✓</button>`}
];
const overlay=document.createElement('div');overlay.id='cl_overlay';overlay.className='cl-overlay';
overlay.innerHTML=`<div class="cl-box"><div class="cl-head"><div style="display:flex;align-items:center;gap:10px">${checklistStep>0?`<button onclick="clBack()" style="background:none;border:.5px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);font-family:'DM Sans',sans-serif">← Back</button>`:''}<div><h2>Order checklist</h2><div class="cl-patient">${o.patientName} — ${o.medication}</div></div></div><button onclick="clClose()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)">✕</button></div>
<div class="cl-steps">${steps.map((s,i)=>{const done=checklistDone.includes(s.id),active=i===checklistStep,locked=i>checklistStep;return`<div class="cl-step ${done?'done':active?'active':locked?'locked':''}"><div class="cl-num">${done?'✓':i+1}</div><div class="cl-body"><div class="cl-title">${s.title}</div><div class="cl-desc">${s.desc}</div>${active||done?`<div class="cl-action" id="cl_action_${s.id}">${active?s.action:''}</div>`:''}</div></div>`;}).join('')}</div></div>`;
document.body.appendChild(overlay);}

function clAdvance(sid){if(!checklistDone.includes(sid))checklistDone.push(sid);checklistStep++;renderChecklistOverlay();}
function clBack(){if(checklistStep<=0)return;checklistStep--;const ids=['billing','sig','place','done'];checklistDone=checklistDone.filter(id=>id!==ids[checklistStep]);renderChecklistOverlay();}
function clCheckBilling(){const cb=document.getElementById('cl_billed');if(cb&&cb.checked){checklistOrder.billingConfirmed=true;setTimeout(()=>clAdvance('billing'),300);}}
function clSaveSig(){const sig=document.getElementById('cl_sig')?.value?.trim();if(!sig){alert('Please enter the sig.');return;}checklistOrder.sig=sig;clAdvance('sig');}
function clShowOrderNumField(){const w=document.getElementById('cl_ordnum_wrap');if(w)w.style.display='block';document.getElementById('cl_ordnum')?.focus();}
function clFlagForCoord(){checklistOrder.status='Awaiting Payment Verification';checklistOrder._needsCoordinatorOrder=true;const ex=state.orders.find(o=>o.id===checklistOrder.id);if(!ex)state.orders.unshift({...checklistOrder});else Object.assign(ex,checklistOrder);saveOrders();clAdvance('place');}
function clSaveOrderNumber(){const num=document.getElementById('cl_ordnum')?.value?.trim();if(!num){alert('Enter the order number.');return;}checklistOrder.orderNumber=num;checklistOrder.status='Ordered';const ex=state.orders.find(o=>o.id===checklistOrder.id);if(!ex)state.orders.unshift({...checklistOrder});else Object.assign(ex,checklistOrder);saveOrders();clAdvance('place');}
function clSaveTracking(){const trk=document.getElementById('cl_tracking')?.value?.trim();if(trk){checklistOrder.trackingNumber=trk;const ex=state.orders.find(o=>o.id===checklistOrder.id);if(ex)ex.trackingNumber=trk;saveOrders();}}
function clFinish(){const ex=state.orders.find(o=>o.id===checklistOrder.id);if(!ex)state.orders.unshift({...checklistOrder});saveOrders();clClose();state.tab='orders';render();}
function clClose(){const el=document.getElementById('cl_overlay');if(el)el.remove();checklistOrder=null;checklistStep=0;checklistDone=[];}

function renderCoordinatorOrders(){
  if(state.selOrder){const o=state.orders.find(x=>x.id===state.selOrder);if(o){return`<div style="max-width:680px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button onclick="state.selOrder=null;render()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">← Back</button><span style="font-size:13px;color:rgba(255,255,255,.8);font-weight:500">${o.patientName} — ${o.medication}</span></div><div class="card card-pad">${renderCoordDetail(o)}</div></div>`;}}
  const aw=state.orders.filter(o=>o.status==='Awaiting Payment Verification'),rp=state.orders.filter(o=>o.status==='Payment Confirmed — Ready to Place'),ac=state.orders.filter(o=>['Ordered','Processing'].includes(o.status)),ot=state.orders.filter(o=>!['Awaiting Payment Verification','Payment Confirmed — Ready to Place','Ordered','Processing'].includes(o.status));
  const srch=(state.filterSearch||'').toLowerCase(),fo=arr=>srch?arr.filter(o=>o.patientName.toLowerCase().includes(srch)||o.medication.toLowerCase().includes(srch)):arr;
  function oRow(o){const sc=[o.billingConfirmed,o.paymentVerifiedInOpti,o.pharmacy,o.doseAmount,o.orderNumber].filter(Boolean).length;return`<tr class="${orderRowClass(o)}" onclick="selOrder('${o.id}')" style="cursor:pointer"><td style="font-size:12px">${o.orderedBy||'—'}</td><td><strong>${o.patientName}</strong>${o.onSubscription?' <span class="badge on-subscription" style="min-width:auto;font-size:9px">📋 Sub</span>':''}${o.patientDOB?`<br><span style="color:var(--muted);font-size:10px">${o.patientDOB}</span>`:''}</td><td style="font-size:12px">${o.medication}</td><td><span class="badge ${statusCls(o.status)}">${o.status}</span></td><td style="font-family:'DM Mono',monospace;font-size:11px">${o.trackingNumber||'—'}</td><td onclick="event.stopPropagation()" style="display:flex;gap:6px;align-items:center"><button class="cl-btn success" style="font-size:11px;padding:5px 11px" onclick="openChecklistForOrder('${o.id}')">▶ (${sc}/5)</button><button class="btn sm danger" style="padding:4px 8px" onclick="delOrd('${o.id}')">🗑️</button></td></tr>`;}
  function sec(title,color,orders){if(!orders.length)return '';return`<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:${color};margin-bottom:6px;padding:6px 12px;background:${color}18;border-radius:6px">${title} (${orders.length})</div><div class="card"><table><thead><tr><th>Provider</th><th>Patient</th><th>Medication</th><th>Status</th><th>Tracking</th><th></th></tr></thead><tbody>${orders.map(o=>oRow(o)).join('')}</tbody></table></div></div>`;}
  return renderQCBar()+`<div style="margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><div style="font-size:13px;font-weight:600;color:var(--muted)">Open orders</div><input style="padding:7px 10px;border:.5px solid var(--border);border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;width:220px" placeholder="Search..." oninput="state.filterSearch=this.value;deferRender()" value="${state.filterSearch||''}"></div>`+sec('⚠ Awaiting payment','#8a4f0a',fo(aw))+sec('✓ Ready to place','#0b6e4f',fo(rp))+sec('Active','#1a5fa8',fo(ac))+(fo(ot).length?`<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--muted);padding:4px 0">Completed / other (${fo(ot).length})</summary><div class="card" style="margin-top:6px"><table><thead><tr><th>Provider</th><th>Patient</th><th>Medication</th><th>Status</th><th>Tracking</th><th></th></tr></thead><tbody>${fo(ot).map(o=>oRow(o)).join('')}</tbody></table></div></details>` :'');
}

function openChecklistForOrder(oid){const o=state.orders.find(x=>x.id===oid);if(!o)return;checklistOrder={...o,_rec:getPharmacyRecommendation(o.medication)};checklistDone=[];if(o.billingConfirmed)checklistDone.push('billing');if(o.paymentVerifiedInOpti)checklistDone.push('payment');if(o.pharmacy)checklistDone.push('pharmacy');if(o.orderNumber)checklistDone.push('place');checklistStep=checklistDone.length;renderChecklistOverlay();}

function renderCoordDetail(o){
  const fm=FORMULARY.find(f=>f.name===o.medication),po=fm?fm.rows.filter(r=>r.p>0).sort((a,b)=>a.p-b.p):[];
  return`<div class="detail"><div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><strong>${o.patientName} — ${o.medication}</strong><div style="font-size:11px;color:var(--muted);margin-top:3px">Ordered by: <strong style="color:var(--text)">${o.orderedBy||'—'}</strong></div></div><button class="btn sm" onclick="state.selOrder=null;render()">✕</button></div>
  ${o.onSubscription?'<div class="alert" style="background:#ede9fe;border:.5px solid #c4b5fd;color:#6d28d9;margin-bottom:8px">📋 <strong>Subscription patient</strong> — do NOT charge for this fill.</div>':''}
  ${o.controlled?`<div class="alert warn" style="margin-bottom:8px">Controlled — print, wet sig, fax</div>`:''}
  ${po.length?`<div style="margin-bottom:12px"><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:6px">Where to order</div><table style="font-size:11px;width:100%"><thead><tr><th>Pharmacy</th><th>Turnaround</th><th>Method</th><th>Notes</th></tr></thead><tbody>${po.map((r,i)=>{const pd=PHARMACIES.find(p=>p.id===r.ph);return`<tr style="${i===0?'background:var(--success-bg)':''}"><td><span class="ph ${r.ph||'stryker'}">${r.l.replace(/ —.*/,'')}</span>${i===0?' ⭐':''}</td><td style="font-size:10px">${pd?pd.turnaround:'—'}</td><td style="font-size:10px">${pd?pd.method:'—'}</td><td style="color:var(--muted);font-size:10px">${r.n||'—'}</td></tr>`;}).join('')}</tbody></table></div>`:''}
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="detail-row"><span class="detail-label">Provider billed</span><span>${o.billingConfirmed?'✓ Yes':'⚠ Not confirmed'}</span></div>
    <div class="detail-row"><span class="detail-label">On subscription</span><span style="display:flex;gap:6px;align-items:center">${o.onSubscription?'<span style="color:#7c3aed;font-weight:600">✓ Monthly billing</span>':'<span style="color:var(--muted)">No</span>'}<button class="btn sm" style="padding:3px 8px;font-size:10px" onclick="updOrd('${o.id}','onSubscription',!${!!o.onSubscription});render()">${o.onSubscription?'Remove':'Mark subscription'}</button></span></div>
    <div style="padding:10px 12px;border:.5px solid var(--success);border-radius:8px;background:var(--success-bg);display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.3px">Patient charge</span><span style="font-size:16px;font-weight:700;color:${o.onSubscription?'#7c3aed':'var(--success)'}">${o.onSubscription?'📋 Subscription — no charge':patientPrices[o.medication]?'$'+patientPrices[o.medication]:'<span style="font-size:12px;color:var(--warn)">Not set</span>'}</span></div>
    <div><label style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);display:block;margin-bottom:5px">Pharmacy</label><select onchange="updOrd('${o.id}','pharmacy',this.value);render()" style="width:100%;padding:8px 10px;border:.5px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)"><option value="">Select...</option>${PHARMACIES.filter(p=>!['Coming Soon','Research'].includes(p.type)).map(p=>`<option value="${p.name}" ${o.pharmacy===p.name?'selected':''}>${p.name}</option>`).join('')}</select>${o.pharmacy?renderInlinePortal(o.pharmacy):'<div style="font-size:11px;color:var(--muted);margin-top:4px">Select pharmacy to see login info</div>'}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:.5px solid ${o.paymentVerifiedInOpti?'var(--success)':'var(--border)'};border-radius:8px;background:${o.paymentVerifiedInOpti?'var(--success-bg)':'var(--surface)'}"><span style="font-size:12px;font-weight:500;color:${o.paymentVerifiedInOpti?'var(--success)':'var(--text)'}">Payment verified in Opti${o.paymentVerifiedInOpti&&o.paymentVerifiedBy?' — by '+o.paymentVerifiedBy:''}</span>${o.paymentVerifiedInOpti?`<span style="font-size:18px">✅</span>`:`<button class="btn sm primary" onclick="coordVerifyPaymentInOpti('${o.id}',true)">Mark verified</button>`}</div>
    <div><label style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);display:block;margin-bottom:5px">LifeFile Order #</label><div style="display:flex;gap:6px"><input id="on_${o.id}" value="${o.orderNumber||''}" placeholder="Type order number..." style="flex:1;padding:8px 10px;border:.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'DM Mono',sans-serif;background:var(--bg);color:var(--text)"><button class="btn sm primary" onclick="coordSaveOrderNumber('${o.id}',document.getElementById('on_${o.id}').value)">Save</button></div>${o.orderNumber?`<div style="font-size:11px;color:var(--success);margin-top:4px">✓ Saved</div>`:''}</div>
    <div><label style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);display:block;margin-bottom:5px">Tracking #</label><div style="display:flex;gap:6px"><input id="ct_${o.id}" value="${o.trackingNumber||''}" placeholder="Type tracking number..." style="flex:1;padding:8px 10px;border:.5px solid var(--border);border-radius:6px;font-size:13px;font-family:'DM Mono',sans-serif;background:var(--bg);color:var(--text)"><button class="btn sm primary" onclick="updOrd('${o.id}','trackingNumber',document.getElementById('ct_${o.id}').value)">Save</button></div>${o.trackingNumber?`<div style="font-size:11px;color:var(--success);margin-top:4px">✓ Saved</div>`:''}</div>
    <div><label style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);display:block;margin-bottom:5px">Staff note</label><textarea id="cn_${o.id}" style="width:100%;padding:8px 10px;border:.5px solid var(--border);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;min-height:52px;resize:vertical;background:var(--bg);color:var(--text)" placeholder="Notes visible to all staff...">${o.notes||''}</textarea><button class="btn sm" style="margin-top:4px" onclick="updOrd('${o.id}','notes',document.getElementById('cn_${o.id}').value)">Save note</button></div>
    <div><button class="btn sm danger" onclick="coordSendBack('${o.id}')">↩ Send back to provider</button></div>

  <div class="ai-context-box"><div style="font-size:13px;font-weight:600;margin-bottom:4px">How to use</div><div style="font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6">1. Click <strong>Copy context prompt</strong> — copies your full clinic data.<br>2. Click <strong>Open Claude.ai</strong> to open a new chat.<br>3. Paste the context, then ask your question.</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><a href="https://claude.ai/new" target="_blank" class="ai-open-btn">🤖 Open Claude.ai →</a><button class="ai-copy-btn" onclick="copyAIContext()">📋 Copy context prompt</button></div>
  <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:6px">Current snapshot — ${orders.length} orders loaded</div>
  <div class="ai-context-preview">Pending (${pending.length}): ${pending.map(o=>o.patientName+' | '+o.medication).join(', ')||'None'}
Active (${active.length}): ${active.map(o=>o.patientName+' | '+o.medication+' | '+(o.trackingNumber||'no tracking')).join(', ')||'None'}
On hold (${hold.length}): ${hold.map(o=>o.patientName+' | '+o.medication+' | '+o.status).join(', ')||'None'}</div></div>
  <div style="background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:16px 20px"><div style="font-size:12px;font-weight:600;margin-bottom:10px">Quick prompts</div><div style="display:flex;flex-wrap:wrap;gap:6px">${['Where do I order tirzepatide for >10mg/week?','Cheapest pharmacy for progesterone?','Steps to place a controlled substance order?','How do I order BPC-157 from Alpha Bio?','Female testosterone routing rule?','Which orders are on hold?','Tadalafil — compound or GoodRx?'].map(q=>`<button onclick="copyPrompt('${q.replace(/'/g,"\\'")}',this)" style="padding:6px 12px;border:.5px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer;background:var(--bg);color:var(--muted);font-family:'DM Sans',sans-serif">${q}</button>`).join('')}</div></div></div>`;
}

function copyAIContext(){
  const orders=state.orders.slice(0,20),p=orders.filter(o=>['Awaiting Payment Verification','Payment Confirmed — Ready to Place'].includes(o.status)),a=orders.filter(o=>['Ordered','Processing','Shipped'].includes(o.status)),h=orders.filter(o=>['On Hold','Returned to Provider'].includes(o.status));
  const text=`You are CompoundTrack AI for Prime HRT & Weight Loss (Clearwater FL). Be direct and specific — staff are busy.\n\n== KEY ROUTING RULES ==\n- Female testosterone → Hallandale 50mg/mL 2mL grapeseed ($12). Wet sig + fax. E-FORCSE.\n- Male testosterone standard → Center City 200mg/mL mfg ($40). Wet sig + fax. E-FORCSE.\n- Male testosterone high-dose >200mg/wk → Brooksville 250mg/mL ($28/10-pack).\n- Tirzepatide ≤10mg/wk → Center City 10mg/mL (30mg $150 / 60mg $265).\n- Tirzepatide >10mg/wk → Hallandale FORTE 15mg/mL ($283). Single poke. REQUIRED.\n- Semaglutide → Center City (cheapest). LifeFile.\n- Research peptides → Alpha Bio. CONSENT FORM required. Drop-ships to patient.\n- Tadalafil → GoodRx first (~$45/90ct). Compound only if can't use GoodRx.\n- Controlled substances → print Rx, WET SIGNATURE, fax BEFORE placing in LifeFile.\n- Enclomiphene → Hallandale ($1.00-1.50/ea). Avoid Strive (double shipping).\n- Sermorelin → Southlake 30mg ($150, $5/mg, 2wk). Brooksville for faster.\n- Gonadorelin → Brooksville ($25/5mL).\n- LDN → Strive ($72/90ct).\n- Progesterone → Brooksville ($0.60/cap).\n- Armour Thyroid → Brooksville ($1.50/ea).\n\n== CURRENT ORDERS ==\nPending (${p.length}): ${p.map(o=>o.patientName+' | '+o.medication+(o.onSubscription?' [SUB]':'')).join(', ')||'None'}\nActive (${a.length}): ${a.map(o=>o.patientName+' | '+o.medication+' | Tracking: '+(o.trackingNumber||'pending')).join(', ')||'None'}\nOn hold (${h.length}): ${h.map(o=>o.patientName+' | '+o.medication+' | '+o.status).join(', ')||'None'}\n\nNow answer my question:`;
  navigator.clipboard.writeText(text).then(()=>showToast('✓ Context copied — paste into Claude.ai then ask your question')).catch(()=>alert('Copy failed.'));
}
function copyPrompt(q,btn){copyAIContext();setTimeout(()=>window.open('https://claude.ai/new','_blank'),300);if(btn){btn.style.background='var(--success-bg)';btn.style.color='var(--success)';btn.style.borderColor='var(--success)';setTimeout(()=>{btn.style.background='';btn.style.color='';btn.style.borderColor='';},2000);}}

function renderInlinePortal(pharmName){if(!pharmName)return '';const portal=PORTALS.find(p=>pharmName.toLowerCase().includes(p.id)||p.name.toLowerCase().includes(pharmName.toLowerCase().split(' ')[0]));if(!portal)return `<div style="font-size:11px;color:var(--muted);margin-top:6px">No portal on file — check Portals tab.</div>`;if(portal.status==='pending')return `<div style="font-size:11px;color:var(--warn);margin-top:6px">⏳ Credentials pending.</div>`;const rk='inline_'+portal.id;if(portal.users){const rows=portal.users.map((u,i)=>{const k=rk+'_'+i,rv=portalReveal[k];return`<div style="padding:7px 0;border-bottom:.5px solid var(--border)"><div style="font-size:11px;font-weight:600;margin-bottom:4px">${u.name}</div><div style="display:flex;flex-direction:column;gap:3px"><div style="display:flex;align-items:center;gap:6px;font-size:11px"><span style="color:var(--muted);width:70px;flex-shrink:0">Username</span><span style="font-family:'DM Mono',monospace">${u.username}</span><button class="btn sm" onclick="copyText('${u.username}','Username copied')" style="padding:2px 7px;font-size:10px">⎘</button></div><div style="display:flex;align-items:center;gap:6px;font-size:11px"><span style="color:var(--muted);width:70px;flex-shrink:0">Password</span><span style="font-family:'DM Mono',monospace">${rv?u.password:'••••••••'}</span><button class="btn sm" onclick="portalReveal['${k}']=!portalReveal['${k}'];render()" style="padding:2px 7px;font-size:10px">${rv?'Hide':'Show'}</button><button class="btn sm" onclick="copyText('${u.password}','Password copied')" style="padding:2px 7px;font-size:10px">⎘</button></div></div></div>`;}).join('');return`<div style="margin-top:8px;padding:10px 12px;background:var(--info-bg);border:.5px solid #c5d8f5;border-radius:8px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--info)">🔐 ${portal.name} — Login</div>${portal.url?`<button class="btn sm primary" onclick="window.open('${portal.url}','_blank')" style="font-size:10px;padding:3px 9px">Open →</button>`:''}</div><div style="font-size:11px;color:var(--muted);margin-bottom:8px;word-break:break-all">${portal.url||''}</div>${rows}</div>`;}
const rv=portalReveal[rk];return`<div style="margin-top:8px;padding:10px 12px;background:var(--info-bg);border:.5px solid #c5d8f5;border-radius:8px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--info)">🔐 ${portal.name}</div>${portal.url?`<button class="btn sm primary" onclick="window.open('${portal.url}','_blank')" style="font-size:10px;padding:3px 9px">Open →</button>`:''}</div><div style="display:flex;flex-direction:column;gap:5px"><div style="display:flex;align-items:center;gap:6px;font-size:11px"><span style="color:var(--muted);width:70px;flex-shrink:0">Username</span><span style="font-family:'DM Mono',monospace">${portal.username||'—'}</span>${portal.username?`<button class="btn sm" onclick="copyText('${portal.username}','Username copied')" style="padding:2px 7px;font-size:10px">⎘</button>`:''}</div><div style="display:flex;align-items:center;gap:6px;font-size:11px"><span style="color:var(--muted);width:70px;flex-shrink:0">Password</span><span style="font-family:'DM Mono',monospace">${rv?portal.password:'••••••••'}</span><button class="btn sm" onclick="portalReveal['${rk}']=!portalReveal['${rk}'];render()" style="padding:2px 7px;font-size:10px">${rv?'Hide':'Show'}</button>${portal.password?`<button class="btn sm" onclick="copyText('${portal.password}','Password copied')" style="padding:2px 7px;font-size:10px">⎘</button>`:''}</div></div></div>`;}

async function boot(){await loadUsers();await load();renderApp();}
boot();

window.toggleSentStatus=function(id){const o=state.orders.find(x=>x.id===id);if(o){o.status=(o.status==='Ordered')?'Processing':'Ordered';saveOrders();render();}};
window.editPatientInfo=function(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const n=prompt('Edit Patient Name:',o.patientName);if(n===null)return;const d=prompt('Edit DOB (MM/DD/YYYY):',o.patientDOB||'');if(d===null)return;o.patientName=n.trim();o.patientDOB=d.trim();saveOrders();render();};
